services:

  liquibase:
    image: ${LIQUIBASE_IMAGE}
    volumes:
      - ../liquibase/changelog:/liquibase/changelog
      - ../liquibase/liquibase.properties:/liquibase/liquibase.properties
      - ../liquibase/lib:/liquibase/lib
    command:
      - --defaults-file=/liquibase/liquibase.properties
      - --changelog-file=master.yml
      - update
    networks:
      - springstarter-network

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE}
    container_name: ${OTEL_COLLECTOR_CONTAINER_NAME}
    command:
      - "--config=/etc/otelcol/config.yml"
    environment:
      TEMPO_ENDPOINT: ${TEMPO_ENDPOINT}
      LOKI_ENDPOINT: ${LOKI_ENDPOINT}
    volumes:
      - ../opentelemetry/otel-collector-config.yml:/etc/otelcol/config.yml
    ports:
      - "${OTEL_GRPC_PORT}:4317"
      - "${OTEL_HTTP_PORT}:4318"
    restart: unless-stopped

  tempo:
    image: ${TEMPO_IMAGE}
    container_name: ${TEMPO_CONTAINER_NAME}
    command:
      - "-config.file=/etc/tempo.yml"
    volumes:
      - ../grafana/tempo.yml:/etc/tempo.yml
    ports:
      - "${TEMPO_PORT}:3200"
    restart: unless-stopped

  backend-app:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    container_name: ${APP_CONTAINER_NAME}
    depends_on:
      liquibase:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER}
      SPRING_REDIS_HOST: ${SPRING_REDIS_HOST}
      SPRING_REDIS_PORT: ${SPRING_REDIS_PORT}
      TYPICODE_BASE_URL: ${TYPICODE_BASE_URL}
    ports:
      - "${APP_PORT}:8080"
    networks:
      - default
      - springstarter-network
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_IMAGE}
    container_name: ${GRAFANA_CONTAINER_NAME}
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      TEMPO_ENDPOINT: ${TEMPO_ENDPOINT}
      LOKI_ENDPOINT: ${LOKI_ENDPOINT}
      TEMPO_PORT: ${TEMPO_PORT}
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - tempo
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE}
    container_name: ${REDIS_CONTAINER_NAME}
    ports:
      - "${SPRING_REDIS_PORT}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  sonarqube:
    image: ${SONARQUBE_IMAGE}
    container_name: ${SONARQUBE_CONTAINER_NAME}
    ports:
      - "${SONARQUBE_PORT}:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://shared-postgres:5432/${POSTGRES_DB}
      SONAR_JDBC_USERNAME: ${POSTGRES_USER}
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - springstarter-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  springstarter-network:
    external: true
    name: springstarter-network