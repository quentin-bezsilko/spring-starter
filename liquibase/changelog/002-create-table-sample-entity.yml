databaseChangeLog:
  - changeSet:
      id: 002-create-table-sample-entity
      author: qbe
      changes:
        - createTable:
            schemaName: mydb
            tableName: sample_entity
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_sample_entity
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_sample_entity_name
              - column:
                  name: description
                  type: VARCHAR(500)
              - column:
                  name: quantity
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: stock
                  type: BIGINT
              - column:
                  name: weight
                  type: DOUBLE PRECISION
              - column:
                  name: ratio
                  type: REAL
              - column:
                  name: price
                  type: NUMERIC(15,2)
              - column:
                  name: active
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: category
                  type: CHAR(1)
              - column:
                  name: manufactured_date
                  type: DATE
              - column:
                  name: manufactured_time
                  type: TIME
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: external_id
                  type: UUID
                  constraints:
                    unique: true
                    uniqueConstraintName: uk_sample_entity_external_id
              - column:
                  name: document
                  type: BYTEA
              - column:
                  name: comments
                  type: TEXT
              - column:
                  name: status
                  type: VARCHAR(20)
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            schemaName: mydb
            tableName: sample_entity