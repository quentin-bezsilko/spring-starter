spring:
  application:
    name: ${SPRING_APPLICATION_NAME:springstarter}
  liquibase:
    enabled: false
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${SPRING_DATASOURCE_SCHEMA:mydb}
        format_sql: false
    show-sql: false
  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: ${SPRING_REDIS_PORT:6379}

app:
  security:
    jwt:
      public-key: ${JWT_PUBLIC_KEY:classpath:certs/public-key.pem}
      issuer: ${JWT_ISSUER:http://localhost:8081/authstarter}
      audience: ${JWT_AUDIENCE:springstarter-api}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/springstarter}
  error:
    include-message: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus

  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.qbe.springstarter: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} [traceId=%X{traceId:-} spanId=%X{spanId:-}] - %msg%n"

cache:
  ttl:
    samples: ${CACHE_SAMPLES_TTL_DURATION:30m}

clients:
  typicode-base-url: ${TYPICODE_BASE_URL}